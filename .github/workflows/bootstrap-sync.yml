name: Verify bootstrap synchronization

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout canonical bootstrap from WDT main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 0x0bug/windows-diagnostics-toolkit
          ref: main
          path: wdt-source
          persist-credentials: false

      - name: Compare bootstrap content without executing it
        shell: pwsh
        run: >-
          ./tests/bootstrap-sync.tests.ps1
          -PublishedPath ./run.ps1
          -CanonicalPath ./wdt-source/scripts/bootstrap/run.ps1

  static-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate SEO and local references
        shell: pwsh
        run: ./tests/site-seo.tests.ps1

      - name: Validate site assets and release-readiness policy
        shell: pwsh
        run: ./tests/site-assets.tests.ps1
