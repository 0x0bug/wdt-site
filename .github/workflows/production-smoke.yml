name: Monitor production website

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy project website']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '43 4 * * *'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout canonical bootstrap from WDT main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 0x0bug/windows-diagnostics-toolkit
          ref: main
          path: wdt-source
          persist-credentials: false

      - name: Check production availability, metadata, TLS, and bootstrap
        shell: pwsh
        run: >-
          ./tests/production-smoke.tests.ps1
          -CanonicalBootstrapPath ./wdt-source/scripts/bootstrap/run.ps1
