name: Deploy project website

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - '.nojekyll'
      - '404.html'
      - 'index.html'
      - 'robots.txt'
      - 'run.ps1'
      - 'sitemap.xml'
      - 'assets/**'
      - 'cases/**'
      - 'scripts/Prepare-PagesArtifact.ps1'
      - 'tests/site-assets.tests.ps1'
      - 'tests/site-seo.tests.ps1'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Validate SEO and local references
        shell: pwsh
        run: ./tests/site-seo.tests.ps1

      - name: Validate Pages artifact contents
        shell: pwsh
        run: ./tests/site-assets.tests.ps1

  package:
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Prepare Pages artifact
        shell: pwsh
        run: ./scripts/Prepare-PagesArtifact.ps1 -OutputPath '${{ runner.temp }}/wdt-site'

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/wdt-site
          include-hidden-files: true

  deploy:
    needs: package
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
