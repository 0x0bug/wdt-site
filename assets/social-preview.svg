<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Windows Diagnostics Toolkit</title>
  <desc id="desc">Read-only PowerShell diagnostics with a terminal-first interface, local reports and no telemetry.</desc>
  <rect width="1280" height="640" fill="#05080b"/>
  <rect x="54" y="48" width="1172" height="544" fill="#0a1016" stroke="#27343f" stroke-width="2"/>
  <path d="M54 104H1226M54 474H1226M700 104V474" stroke="#18222e" stroke-width="2"/>
  <text x="82" y="84" fill="#46e08a" font-family="Cascadia Code, Consolas, monospace" font-size="22" font-weight="700">WDT / WINDOWS DIAGNOSTICS TOOLKIT</text>
  <text x="1100" y="84" fill="#46e08a" font-family="Cascadia Code, Consolas, monospace" font-size="19" font-weight="700">[READY]</text>

  <text x="82" y="151" fill="#8290a0" font-family="Cascadia Code, Consolas, monospace" font-size="20">PS C:\WDT&gt; .\Invoke-WindowsDiagnostics.ps1</text>
  <text x="82" y="230" fill="#eaf0f5" font-family="Cascadia Code, Consolas, monospace" font-size="54" font-weight="800">See what Windows</text>
  <text x="82" y="292" fill="#eaf0f5" font-family="Cascadia Code, Consolas, monospace" font-size="54" font-weight="800">is doing.</text>
  <text x="82" y="354" fill="#46e08a" font-family="Cascadia Code, Consolas, monospace" font-size="54" font-weight="800">Change nothing.</text>
  <text x="82" y="414" fill="#a6b3bf" font-family="Cascadia Code, Consolas, monospace" font-size="21">Read-only diagnostics · Local reports · No telemetry</text>

  <text x="732" y="150" fill="#46e08a" font-family="Cascadia Code, Consolas, monospace" font-size="20" font-weight="700">DIAGNOSTICS</text>
  <text x="1092" y="150" fill="#46e08a" font-family="Cascadia Code, Consolas, monospace" font-size="18" font-weight="700">10 / 10</text>
  <path d="M732 170H1194" stroke="#8290a0"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="20" font-weight="700">
    <text x="732" y="214" fill="#46e08a">[x]</text><text x="782" y="214" fill="#eaf0f5">System information</text>
    <text x="732" y="254" fill="#46e08a">[x]</text><text x="782" y="254" fill="#eaf0f5">Security posture</text>
    <text x="732" y="294" fill="#46e08a">[x]</text><text x="782" y="294" fill="#eaf0f5">Performance snapshot</text>
    <text x="732" y="334" fill="#46e08a">[x]</text><text x="782" y="334" fill="#eaf0f5">Network context</text>
    <text x="732" y="374" fill="#46e08a">[x]</text><text x="782" y="374" fill="#eaf0f5">Disk health</text>
    <text x="732" y="414" fill="#46e08a">[x]</text><text x="782" y="414" fill="#f5b544">RUN DIAGNOSTICS</text>
  </g>

  <text x="82" y="520" fill="#46e08a" font-family="Cascadia Code, Consolas, monospace" font-size="20" font-weight="700">[x] READ-ONLY</text>
  <text x="330" y="520" fill="#46e08a" font-family="Cascadia Code, Consolas, monospace" font-size="20" font-weight="700">[x] LOCAL</text>
  <text x="512" y="520" fill="#46e08a" font-family="Cascadia Code, Consolas, monospace" font-size="20" font-weight="700">[x] PRIVACY MODE</text>
  <text x="82" y="560" fill="#46e08a" font-family="Cascadia Code, Consolas, monospace" font-size="20">github.com/0x0bug/windows-diagnostics-toolkit</text>
  <text x="1085" y="560" fill="#8290a0" font-family="Cascadia Code, Consolas, monospace" font-size="20">MIT</text>
</svg>
